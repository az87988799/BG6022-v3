[orca]
executable = 'E:\orca\orca.exe'

[runtime]
data_root = 'E:\BG6022-v3-data'
cores = 4
memory_mb = 1024
maxcore_mb = 192
max_concurrent_jobs = 1
confirm_before_compute = true
semantic_planner_v1 = true
attempt_timeout_seconds = 1200
run_active_timeout_seconds = 3600
output_limit_mb = 64
workdir_limit_mb = 512

[defaults]
method_profile = "r2scan3c"
environment = "gas"

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
request_timeout_seconds = 60
max_tokens = 4096
structured_output_corrections = 1

[repair]
enabled = true
max_attempts_per_science_step = 3
max_extra_executions_by_category = { electronic_structure = 3 }
max_plan_revisions = 2

[molecule]
pubchem_timeout_seconds = 20
pubchem_max_attempts = 3
pubchem_formula_max_cids = 32
pubchem_formula_max_display_candidates = 5
embedding_timeout_seconds = 60
embedding_seeds = [61453, 61454]
